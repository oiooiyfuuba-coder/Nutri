<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NutriPet 健食隨身寶</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:monospace,sans-serif}
body{background:#0f172a;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:10px}
.tamagotchi{background:#f0e68c;border:8px solid #d4c85d;border-radius:35px;padding:16px;width:100%;max-width:390px;box-shadow:0 15px 30px #0008}
.screen{background:#e8efe6;border:4px solid #b2c4af;border-radius:14px;padding:14px;min-height:490px;color:#2d4028;display:flex;flex-direction:column;justify-content:space-between}
.card{background:#d3ded0;border:2px solid #5c7356;border-radius:8px;padding:10px;margin-bottom:8px;font-size:13px}
.card-title{font-weight:bold;border-bottom:1px solid #5c7356;padding-bottom:5px;margin-bottom:7px;font-size:12px}
input,select{width:100%;padding:8px;margin:4px 0 8px;border:1px solid #5c7356;border-radius:4px;background:#fff;font-size:12px;color:#2d4028;outline:none}
button{background:#3d5238;color:#e8efe6;border:1px solid #2d4028;border-radius:6px;padding:9px;width:100%;font-weight:bold;cursor:pointer;font-size:12px;margin-top:4px}
button:active{transform:scale(.98)}
button:disabled{background:#94a3b8;color:#475569}
.nav{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;border-top:1px solid #5c7356;padding-top:8px;margin-top:4px}
.nav button{font-size:9px;padding:7px 1px;background:#d3ded0;color:#2d4028;border:1px solid #5c7356;margin:0}
.nav button.active{background:#3d5238;color:#fff}
.flex-between{display:flex;justify-content:space-between;align-items:center;gap:5px}
.text-center{text-align:center}
.pet-avatar{display:inline-block;width:90px;height:90px;background:#c3d4c0;border:2px solid #5c7356;border-radius:12px;padding:5px;margin:5px}
.pet-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:5px}
.pet-choice{cursor:pointer;text-align:center;padding:5px;border:1px solid #5c7356;border-radius:6px;background:#e8efe6}
.pet-choice.selected{background:#3d5238;color:white}
.pet-choice svg{width:48px;height:48px}
.progress{height:12px;background:#fff;border:1px solid #5c7356;border-radius:10px;overflow:hidden;margin:5px 0}
.progress>div{height:100%;background:#6b9b65;transition:width .4s}
.small{font-size:10px;line-height:1.5}
.muted{opacity:.7}
.good{color:#166534;font-weight:bold}
.bad{color:#991b1b;font-weight:bold}
.pet-room{position:relative;height:125px;background:#c3d4c0;border:2px solid #5c7356;border-radius:8px;overflow:hidden;display:flex;justify-content:center;align-items:flex-end;padding-bottom:13px;margin-bottom:7px}
.ground{position:absolute;left:0;right:0;bottom:8px;height:2px;background:#5c7356;opacity:.5}
.pet-walker{position:relative;animation:wander 10s steps(14) infinite}
.pet-bob{animation:bob .8s infinite}
.paused{animation-play-state:paused!important}
@keyframes wander{0%{transform:translateX(-65px)}40%{transform:translateX(65px)}50%{transform:translateX(65px)}90%{transform:translateX(-65px)}100%{transform:translateX(-65px)}}
@keyframes bob{0%,49%{transform:translateY(0)}50%,100%{transform:translateY(-3px)}}
.sprite{position:relative;transform-origin:50% 100%;transition:transform .3s}
.sprite.chewing{animation:chewbody .5s infinite}
.sprite.gulp{animation:gulp .6s steps(2) 1}
@keyframes chewbody{0%,49%{transform:scale(1)}50%,100%{transform:scale(1.06,.93)}}
@keyframes gulp{0%{transform:scale(1)}50%{transform:scale(.92,1.1)}100%{transform:scale(1)}}
.mouth{position:absolute;left:50%;margin-left:-5px;width:10px;height:3px;background:#3a2430;z-index:2;border-radius:50%}
.mouth.open{height:8px}
.mouth.chew{animation:chewmouth .5s infinite}
@keyframes chewmouth{0%,49%{height:3px}50%,100%{height:9px}}
.food{display:none;position:absolute;left:50%;margin-left:-11px;width:22px;height:22px;z-index:3}
.food.fall{display:block;animation:fall .8s steps(6) forwards}
@keyframes fall{from{top:-30px}to{top:55px}}
.pop{position:absolute;left:50%;top:-6px;transform:translateX(-50%);font-size:11px;font-weight:bold;color:#b91c1c;opacity:0;white-space:nowrap}
.pop.show{animation:popup 1s steps(6) forwards}
@keyframes popup{0%{opacity:1;top:-6px}100%{opacity:0;top:-30px}}
.photo-preview{width:100%;max-height:180px;object-fit:contain;border:1px solid #5c7356;border-radius:6px;background:#fff;margin:5px 0}
.food-option{display:flex;align-items:center;justify-content:space-between;gap:5px;padding:7px;margin:4px 0;background:#edf3eb;border:1px solid #9bad96;border-radius:5px;font-size:11px}
.food-option button{width:auto;margin:0;padding:6px 9px}
table{width:100%;border-collapse:collapse;font-size:10px;text-align:center}
th,td{border:1px solid #8b9c86;padding:5px 2px}
th{background:#b9cbb4}
.week-table{overflow-x:auto}
.stage-label{display:inline-block;padding:4px 9px;background:#e8efe6;border:1px solid #5c7356;border-radius:20px;font-size:10px;font-weight:bold;margin:3px}
.evolution-note{background:#edf3eb;border:1px dashed #789071;border-radius:6px;padding:7px;font-size:10px;line-height:1.5;margin-top:6px}
.upload-label{display:block;position:relative;overflow:hidden;background:#3d5238;color:white;border-radius:6px;padding:13px;cursor:pointer;font-weight:bold;font-size:12px;margin-top:5px;text-align:center;border:1px solid #2d4028}
.upload-label:active{opacity:.8}
.upload-label input[type=file]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;margin:0;padding:0}
.confidence-bar{height:7px;background:#fff;border:1px solid #9bad96;border-radius:8px;overflow:hidden;margin-top:4px}
.confidence-bar div{height:100%;background:#6b9b65}
.upload-status{font-size:10px;margin-top:6px;line-height:1.5}
</style>
</head>

function svgOf(p){
 var rows=p.g,r='';
 for(var y=0;y<rows.length;y++){

  while(x<rows[y].length){
   var c=rows[y].charAt(x);

========================= */

function rawProgress(){
 var p=state.profile;
 var start=Number(p.startWeight||p.weight);
 var current=Number(p.currentWeight||p.weight);
 var target=Number(p.targetWeight);
 var total=Math.abs(start-target);
 if(total<0.01)return 100;
 var remaining=Math.abs(current-target);
 return Math.max(0,Math.min(100,((total-remaining)/total)*100));
}
function goalProgress(){return Math.max(Number(state.profile.bestProgress||0),rawProgress())}
function petStage(){var n=goalProgress();if(n>=70)return 2;if(n>=30)return 1;return 0}
function stageName(){return ['幼幼態','成長態','完全體'][petStage()]}
function stageDescription(){
 return ['寵物仲係 BB，努力陪你開始健康生活！','寵物長大咗！你嘅努力已經慢慢見到成果。','寵物進化成功！繼續保持健康習慣！'][petStage()];
}

/* =========================
   4. 卡路里計算
========================= */

function getCalories(){
 var p=state.profile;
 var bmr=10*p.weight+6.25*p.height-5*p.age-161;
 var mult={'0':1.2,'1-3':1.375,'3-5':1.55,'6-7':1.725};
 var tdee=bmr*(mult[p.exercise]||1.375),target=tdee;
 if(p.goal==='loss')target-=400;
 if(p.goal==='gain')target+=300;
 return Math.max(1200,Math.round(target));
}
function totalCalories(){
 return state.meals.reduce(function(sum,m){return sum+Math.round(m.kcal*(m.portion||1))},0);
}
function autoPredictCalories(value){
 var el=document.getElementById('textKcalInput');if(!el)return;
 var v=value.trim().toLowerCase();if(!v){el.value=400;return}
 var found=null;
 Object.keys(MEAL_DB).some(function(k){
  if(MEAL_DB[k].keywords.some(function(w){return v.includes(w.toLowerCase())})){found=MEAL_DB[k].kcal;return true}
  return false;
 });
 el.value=found||550;
}

/* =========================
   5. CNN 食物圖片分類
   只辨認：東坡肉、沙律
========================= */

/* 將以下網址換成你訓練好的 Teachable Machine 模型網址。
   模型必須只有兩個類別：
   1. 東坡肉
   2. 沙律
   未設定網址時，仍可上載圖片及手動選擇食物。 */

var AI_MODEL_URL='';

var foodCNNModel=null;
var cnnLoadingPromise=null;

/* 只保留東坡肉及沙律的分類對照 */
var CNN_CLASS_MAP={
 '東坡肉':'pork',
 '紅燒五花肉':'pork',
 '五花肉':'pork',
 '紅燒肉':'pork',
 '扣肉':'pork',
 'pork':'pork',
 'pork belly':'pork',
 'dongpo pork':'pork',

 '沙律':'salad',
 '蔬菜沙律':'salad',
 '雞胸肉沙律':'salad',
 'salad':'salad',
 'vegetable salad':'salad'
};

function normalizeCNNLabel(label){
 return String(label||'').trim().toLowerCase().replace(/[_-]/g,' ').replace(/\s+/g,' ');
}

async function loadFoodCNN(){
 if(foodCNNModel)return foodCNNModel;

 if(!AI_MODEL_URL){
  state.aiStatus='未設定模型';
  state.aiError='圖片已成功上載。要啟用 AI 辨認，請先設定 AI_MODEL_URL；你仍可使用手動選擇食物。';
  throw new Error(state.aiError);
 }

 if(!window.tmImage){
  state.aiStatus='套件載入失敗';
  state.aiError='AI 套件未能載入，請檢查網絡連線。';
  throw new Error(state.aiError);
 }

 if(!cnnLoadingPromise){
  cnnLoadingPromise=(async function(){
   state.aiStatus='正在載入 CNN 模型...';
   state.aiError='';
   var modelURL=AI_MODEL_URL.replace(/\/?$/,'/');
   var model=await tmImage.load(modelURL+'model.json',modelURL+'metadata.json');
   foodCNNModel=model;
   state.aiStatus='CNN 模型已載入';
   return model;
  })();
 }

 try{return await cnnLoadingPromise}
 catch(error){
  cnnLoadingPromise=null;
  foodCNNModel=null;
  state.aiStatus='模型載入失敗';
  state.aiError=error.message||'無法載入模型';
  throw error;
 }
}

/* 只接受 pork 或 salad，而且信心分數必須達到 70% */
async function predictFoodWithCNN(img){
 var model=await loadFoodCNN();
 var predictions=await model.predict(img);

 var results=predictions.map(function(item){
  var originalLabel=item.className;
  var normalizedLabel=normalizeCNNLabel(originalLabel);
  var foodId=CNN_CLASS_MAP[normalizedLabel];

  return {
   label:originalLabel,
   id:foodId||null,
   confidence:Number(item.probability||0)
  };
 });

 var validResults=results.filter(function(item){
  return (
   (item.id==='pork'||item.id==='salad') &&
   item.confidence>=0.70
  );
 });

 validResults.sort(function(a,b){
  return b.confidence-a.confidence;
 });

 state.aiStatus=validResults.length?'CNN 辨認完成':'未能確認是東坡肉或沙律';

 return validResults;
}

function loadImage(src){
 return new Promise(function(resolve,reject){
  var img=new Image();
  img.onload=function(){resolve(img)};
  img.onerror=function(){reject(new Error('瀏覽器無法讀取這張圖片。請嘗試 JPG 或 PNG 格式。'))};
  img.src=src;
 });
}

window.doLogin=function(){

 if(!el||!el.value.trim()){alert('請輸入 Email！');return}
 state.email=el.value.trim();state.step=2;render();
};
window.selectPet=function(k){if(state.eating)return;state.profile.pet=k;render()};
window.saveProfile=function(){
 var v=function(id){return document.getElementById(id).value};
 var weight=Number(v('pWeight')),target=Number(v('pTarget')),height=Number(v('pHeight')),age=Number(v('pAge'));
 if(!weight||!target||!height||!age||weight<=0||target<=0){alert('請輸入正確的個人資料及體重。');return}
 state.profile.name=v('pName')||'PLAYER 1';
 state.profile.weight=weight;state.profile.startWeight=weight;state.profile.currentWeight=weight;
 state.profile.targetWeight=target;state.profile.height=height;state.profile.age=age;

window.switchTab=function(t){if(state.eating)return;state.tab=t;render()};

window.saveWeight=function(){
 var el=document.getElementById('newWeight'),n=Number(el&&el.value);
 if(!n||n<1||n>500){alert('請輸入有效體重。');return}
 var oldStage=petStage();
 state.profile.currentWeight=n;
 state.weightLog.push({day:state.day,weight:n,date:new Date().toLocaleDateString()});
 var progress=rawProgress();
 state.profile.bestProgress=Math.max(state.profile.bestProgress||0,progress);
 var newStage=petStage();
 if(newStage>oldStage)alert('🎉 恭喜！你嘅努力令寵物進化成「'+stageName()+'」！');
 else alert('體重紀錄已更新！寵物會繼續陪你努力。');
 render();
};

/* =========================
   9. 相片上載及 CNN 辨認
========================= */

window.handleFileSelect=async function(event){
 var input=event.target;
 var file=input.files&&input.files[0];
 if(!file)return;

 var allowed=/^image\//i.test(file.type)||/\.(jpg|jpeg|png|webp|gif|heic|heif)$/i.test(file.name);
 if(!allowed){
  alert('請選擇圖片檔案，例如 JPG、PNG 或 WebP。');
  input.value='';
  return;
 }
 if(file.size>12*1024*1024){
  alert('圖片太大，請選擇 12MB 以下的圖片。');
  input.value='';
  return;
 }

 var mealSelect=document.getElementById('mealSelectType');
 if(mealSelect)state.mealType=mealSelect.value;

 state.previewImg=null;
 state.portion=1;
 state.scanResult=null;
 state.candidates=[];
 state.aiStatus='正在讀取圖片...';
 state.aiError='';
 render();

 var reader=new FileReader();

 reader.onload=function(e){
  if(!e.target||!e.target.result){
   state.aiStatus='圖片讀取失敗';
   state.aiError='無法讀取圖片，請重新選擇。';
   render();
   return;
  }
  state.previewImg=e.target.result;
  state.aiStatus='圖片已上載，準備辨認...';
  state.aiError='';
  render();
  runCNNForUploadedImage(state.previewImg);
 };

 reader.onerror=function(){
  state.aiStatus='圖片讀取失敗';
  state.aiError='瀏覽器讀取圖片時發生錯誤，請重新選擇 JPG 或 PNG 圖片。';
  render();
 };

 reader.onabort=function(){
  state.aiStatus='圖片讀取已取消';
  state.aiError='請重新選擇圖片。';
  render();
 };

 try{
  reader.readAsDataURL(file);
 }catch(error){
  state.aiStatus='圖片讀取失敗';
  state.aiError=error.message||'無法讀取圖片。';
  render();
 }

 input.value='';
};

async function runCNNForUploadedImage(imageData){
 try{
  var img=await loadImage(imageData);
  var results=await predictFoodWithCNN(img);
  state.candidates=results;

  if(results.length===0){
   state.aiStatus='未能確認是東坡肉或沙律';
   state.aiError='AI 只支援東坡肉及沙律，或辨認信心未達 70%。你可以在下面手動選擇食物。';
  }
  render();
 }catch(error){
  state.aiStatus='圖片已上載；CNN 未能辨認';
  state.aiError=error.message||'模型發生錯誤。你仍可手動選擇食物。';
  console.error('CNN error:',error);
  render();
 }
}

window.pickFood=function(id){
 if(!MEAL_DB[id])return;
 var result=(state.candidates||[]).find(function(item){return item.id===id});
 state.scanResult={
  id:id,name:MEAL_DB[id].name,kcal:MEAL_DB[id].kcal,
  confidence:result?result.confidence:null,
  aiLabel:result?result.label:'手動選擇'
 };
 state.portion=1;render();
};

window.pickManualFood=function(){
 var el=document.getElementById('manualFood');
 if(el){
  state.scanResult={
   id:el.value,name:MEAL_DB[el.value].name,kcal:MEAL_DB[el.value].kcal,
   confidence:null,aiLabel:'手動選擇'
  };
  state.portion=1;render();
 }
};

window.changePortion=function(v){
 var n=Number(v);
 if(!n||n<0.25||n>5){alert('份量請輸入 0.25 至 5 倍。');return}
 state.portion=n;
 var el=document.getElementById('photoPortion');
 if(el)el.value=n;
};

window.confirmMeal=function(){
 if(!state.scanResult)return;
 state.meals.push({
  type:state.mealType,name:state.scanResult.name,kcal:state.scanResult.kcal,
  portion:state.portion,aiLabel:state.scanResult.aiLabel||'手動選擇',
  confidence:state.scanResult.confidence===null||state.scanResult.confidence===undefined?null:state.scanResult.confidence
 });
 var confidenceText=state.scanResult.confidence===null||state.scanResult.confidence===undefined?'':'\nAI 信心分數：'+(state.scanResult.confidence*100).toFixed(1)+'%';
 alert('成功記錄 '+state.scanResult.name+'，估算 '+Math.round(state.scanResult.kcal*state.portion)+' kcal。'+confidenceText);
 state.previewImg=null;state.scanResult=null;state.candidates=[];state.tab='home';render();
};

window.resetScan=function(){
 state.previewImg=null;state.scanResult=null;state.candidates=[];
 state.aiError='';state.aiStatus='未載入模型';state.portion=1;render();
};

window.submitTextMeal=function(){
 var name=document.getElementById('textMealInput')?.value.trim();
 var kcal=Number(document.getElementById('textKcalInput')?.value);
 var portion=Number(document.getElementById('textPortionInput')?.value);
 if(!name){alert('請輸入食物名稱！');return}
 if(!Number.isFinite(kcal)||kcal<0){alert('請輸入有效卡路里。');return}
 if(!Number.isFinite(portion)||portion<=0||portion>5){alert('請輸入有效份量。');return}
 state.mealType=document.getElementById('mealSelectType')?.value||state.mealType;
 state.meals.push({type:state.mealType,name:name,kcal:kcal,portion:portion});
 alert('成功記錄 '+name+'，約 '+Math.round(kcal*portion)+' kcal。');
 state.tab='home';render();
};

/* =========================
   10. 飲水
========================= */

window.addWater=function(amount){
 state.water+=amount;
 if(state.water>=2000&&!state.waterRewarded){state.waterRewarded=true;state.stars+=1;alert('💧 太棒了！獲得 ⭐ +1！')}
 render();
};
window.resetWater=function(){state.water=0;state.waterRewarded=false;render()};

/* =========================
   11. 打卡
========================= */

window.handleStamp=function(){
 if(state.stamped){alert('今日已經打卡！');return}
 var total=totalCalories(),target=getCalories();
 var b=state.meals.some(function(m){return m.type==='breakfast'});
 var l=state.meals.some(function(m){return m.type==='lunch'});
 var d=state.meals.some(function(m){return m.type==='dinner'});
 if(!(b&&l&&d&&total>0&&total<=target)){alert('請先記錄早餐、午餐、晚餐，並留意每日飲食目標。');return}
 state.stamped=true;state.stars+=2;state.exp+=2;
 alert('🎉 打卡成功！獲得 +2 ⭐ 星星！');render();
};

/* =========================
   12. 餵食及動畫
========================= */

window.feedPet=function(key){
 var f=FOODS[key];
 if(state.eating)return;
 if(state.stars<f.cost){alert('星星不足！先完成打卡或飲水任務啦！');return}
 state.stars-=f.cost;startEat(key);
};

window.startEat=function(key){
 var f=FOODS[key];
 var walker=document.getElementById('petWalker');
 var bob=document.getElementById('petBob');
 var food=document.getElementById('foodSlot');
 var mouth=document.getElementById('petMouth');
 var sprite=document.getElementById('petSprite');
 var pop=document.getElementById('popFx');

 if(!walker||!bob||!food||!mouth||!sprite||!pop){state.eating=false;render();return}

 state.eating=true;
 walker.classList.add('paused');bob.classList.add('paused');
 food.innerHTML=f.svg;food.className='food fall';

 var seq=[
  [700,function(){mouth.className='mouth open'}],
  [900,function(){mouth.className='mouth chew';sprite.classList.add('chewing')}],
  [1500,function(){food.style.transform='scale(.7)'}],
  [2100,function(){food.style.transform='scale(.4)'}],
  [2700,function(){food.style.transform='scale(.15)'}],
  [3200,function(){food.className='food';mouth.className='mouth';sprite.classList.remove('chewing');sprite.classList.add('gulp')}],
  [3800,function(){sprite.classList.remove('gulp');pop.textContent='♥ EXP +'+f.exp;pop.className='pop show'}],
  [4800,function(){state.exp+=f.exp;state.eating=false;render()}]
 ];
 seq.forEach(function(s){setTimeout(function(){try{s[1]()}catch(e){}},s[0])});
};

/* =========================
   13. 開始
========================= */

render();

</script>
</body>
</html>
